<!DOCTYPE html>
<html>
<head>
    <title>University Admission Form</title>
</head>

<body>

    <h1>University Admission Form</h1>

    <form>

        <fieldset>
            <legend>Personal Information</legend>

            <label>Full Name:</label><br>
            <input type="text" name="fullname" >
            <br><br>

            <label>Email:</label><br>
            <input type="email" name="email" >
            <br><br>

            <label>Date of Birth:</label><br>
            <input type="date" name="dob" >
            <br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <br><br>

        </fieldset>

        <fieldset>
            <legend>Academic Information</legend>

            <label>College Name:</label><br>
            <input type="text" name="college" >
            <br><br>

            <label>GPA:</label><br>
            <input type="text" name="gpa" >
            <br><br>

            <label>Preferred Department:</label><br>
            <select name="department">
                <option>CSE</option>
                <option>EEE</option>
                <option>BBA</option>
                <option>Architecture</option>
            </select>
            <br><br>

            <label>Interests:</label><br>
            <input type="checkbox" name="interest1"> Programming
            <input type="checkbox" name="interest2"> Research
            <input type="checkbox" name="interest3"> Sports
            <br><br>

        </fieldset>

        <fieldset>
            <legend>Documents</legend>

            <label>Upload Transcript:</label><br>
            <input type="file" name="transcript" required>
            <br><br>

        </fieldset>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
