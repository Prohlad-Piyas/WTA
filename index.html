<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">


    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">

        <h1>Employee Management System</h1>

        <label for="empName">Employee Name</label>
        <input type="text" id="empName" placeholder="Enter Employee Name">

        <label for="empID">Employee ID</label>
        <input type="text" id="empID" placeholder="Enter Employee ID">

        <label for="department">Department</label>
        <input type="text" id="department" placeholder="Enter Department">

        <label for="salary">Monthly Salary</label>
        <input type="number" id="salary" placeholder="Enter Monthly Salary">

        <div class="button-group">
            <button id="generateBtn">Generate Employee Card</button>
            <button id="resetBtn">Reset</button>
        </div>

        
        <div id="employeeCard"></div>

    </div>

</body>
</html>
